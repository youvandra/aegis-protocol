# Single service: it serves the API, the Hedera gateway and the built frontend.
#
# Supervise this with Docker and nothing else. Adding pm2 or a systemd unit on
# top means two supervisors racing to restart the same process.
services:
  aegis:
    build:
      context: .
      args:
        VITE_WAGMI_PROJECT_ID: ${VITE_WAGMI_PROJECT_ID}
        VITE_HEDERA_ACCOUNT_ID: ${VITE_HEDERA_ACCOUNT_ID}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HEDERA_ACCOUNT_ID: ${HEDERA_ACCOUNT_ID}
      HEDERA_PRIVATE_KEY: ${HEDERA_PRIVATE_KEY}
      HEDERA_NETWORK: ${HEDERA_NETWORK:-testnet}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
    volumes:
      - aegis-data:/data
    logging:
      driver: json-file
      options:
        # A full disk has taken this host down before; cap the logs.
        max-size: "10m"
        max-file: "3"

  # Continuous backup of the SQLite file. Without this, losing the volume loses
  # every legacy plan, group and relay.
  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    depends_on:
      - aegis
    command: replicate
    volumes:
      - aegis-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}

volumes:
  aegis-data:
